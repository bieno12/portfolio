<style>

</style>
<div class="container col-xxl-8 px-4 py-5">
    <h1 class="display-5 fw-bold text-center">Projects</h1>
    <div id="carouselExampleDark" class="carousel carousel-dark slide">
        <div class="carousel-indicators">
            @for (project of PROJECTS; track $index) {
            <button type="button"  [class.active]="$index == currentProjectIndex()" (click)="goTo($index)"></button>
            }
        </div>
        <div class="my-5"></div>
        <div class="carousel-inner p-4">

            @for (project of PROJECTS; track $index) {
            <div class="carousel-item" [class.active]="$index == currentProjectIndex()" style="height: 400px;">
                <div class="d-flex align-items-center h-100">
                    <img [src]="project.image_url || 'cute-frog.jpeg'" class="me-4"  style="width: 40%; height: 100%; object-fit: cover;">
                    <div class="flex-grow-1">
                        <h5 class="mb-2">{{project.title}}</h5>
                        <h6 class="mb-2 text-muted">{{project.period}}</h6>

                        <ul class="list-group ">
                            @for (desc of project.description; track $index) {
                            <li class="list-group-item" >{{desc}}</li>
                            }
                        </ul>
                        <div>
                            @for (tech of project.technologies; track $index) {
                            <span class="badge bg-primary me-2">{{tech}}</span>
                            }
                        </div>
                    </div>
                </div>
            </div>
            }

        </div>
        <button class="carousel-control-prev" (click)="prev()" type="button">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" (click)="next()">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
        </button>
    </div>
</div>
